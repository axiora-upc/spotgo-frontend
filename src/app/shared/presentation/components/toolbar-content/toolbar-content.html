<!--
  mat-toolbar creates the top toolbar of the application.

  This is the main horizontal bar at the top of the page.
-->
<mat-toolbar class="toolbar">

  <!--
    mat-toolbar-row creates one horizontal row inside the toolbar.

    Everything inside this row is placed in the same line:
    logo/name, search box, notification icon, user icon, and language switcher.
  -->
  <mat-toolbar-row class="toolbar-row">

    <!--
      brand is the left section of the toolbar.

      It contains:
      - the SpotGo logo image
      - the SpotGo application name

      The class "brand" is used in CSS to align the logo and text horizontally.
    -->
    <div class="brand">

      <!--
        logo-container is the box that holds the logo image.

        It helps control the logo size and spacing.
      -->
      <div class="logo-container">

        <!--
          This image loads the SpotGo logo from the assets folder.

          The leading slash (/) makes it an absolute path from the app root,
          ensuring it works correctly in both development and production builds.

          alt describes the image for accessibility.
        -->
        <img src="assets/spotgo-logo.png" alt="SpotGo logo" class="logo-image" />

      </div>

      <!--
        brand-name shows the application name next to the logo.
      -->
      <span class="brand-name">SpotGo</span>
    </div>

    <!--
      toolbar-actions is the right section of the toolbar.

      It contains:
      - user account button (with view mode menu)
      - language switcher
    -->
    <div class="toolbar-actions">

      <!--
        User account button.

        [matMenuTriggerFor]="accountMenu" connects this button to the
        mat-menu defined below. When clicked, the dropdown appears.
      -->
      <button
        mat-icon-button
        class="icon-button"
        type="button"
        [attr.aria-label]="'toolbar.account' | translate"
        [matMenuTriggerFor]="accountMenu">
        <mat-icon>account_circle</mat-icon>
      </button>

      <!--
        accountMenu is the dropdown that appears when clicking the account button.

        It used to let anyone manually switch between "User View" and
        "Admin View". That toggle is gone: the sidebar now follows the
        REAL role resolved at login/register (see AuthStore). This menu
        just shows who is signed in and offers a way to log out.
      -->
      <mat-menu #accountMenu="matMenu">

        @if (currentUser(); as user) {
          <div class="account-menu-header">
            <span class="account-menu-name">{{ user.fullName }}</span>
            <span class="account-menu-email">{{ user.email }}</span>
          </div>
        }

        <!--
          Change password option.

          Opens ChangePasswordDialog. Available to every authenticated
          user regardless of role, since this menu lives in the shared
          toolbar rather than in the admin-only Settings page.
        -->
        <button mat-menu-item (click)="openChangePassword()">
          <mat-icon>lock_reset</mat-icon>
          <span>{{ 'toolbar.change-password' | translate }}</span>
        </button>

        <!--
          Logout option.

          Clicking this calls logout(), which clears the persisted auth
          data and navigates back to the login page.
        -->
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>{{ 'toolbar.logout' | translate }}</span>
        </button>

      </mat-menu>

      <!--
        This renders the LanguageSwitcher component.
      -->
      <app-language-switcher></app-language-switcher>

    </div>

  </mat-toolbar-row>
</mat-toolbar>
