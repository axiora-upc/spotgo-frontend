<!--
  Contenedor principal del dialog de borrar croquis.
-->
<div class="dialog-container">

  <h2 class="dialog-title">{{ 'settings.blueprint.delete-dialog-title' | translate }}</h2>

  <p class="dialog-subtitle">{{ 'settings.blueprint.delete-dialog-subtitle' | translate }}</p>

  <!-- Lista de croquis subidos: el admin elige cuál borrar -->
  <div class="name-field">
    <label class="name-label">{{ 'settings.blueprint.select-label' | translate }}</label>
    <select class="name-select" [(ngModel)]="nameToDelete">
      <option value="" disabled>{{ 'settings.blueprint.select-placeholder' | translate }}</option>
      @for (name of existingNames; track name) {
        <option [value]="name">{{ name }}</option>
      }
    </select>
  </div>

  <!-- Botones de acción -->
  <div class="dialog-actions">

    <!--
      Botón Borrar: deshabilitado si no se eligió ningún croquis.
      Usa el color rojo para indicar que es una acción destructiva.
    -->
    <button
      mat-flat-button
      class="btn-delete"
      [disabled]="!nameToDelete"
      (click)="confirm()">
      {{ 'settings.blueprint.delete-btn' | translate }}
    </button>

    <button mat-stroked-button class="btn-cancel" (click)="cancel()">
      {{ 'settings.blueprint.cancel-btn' | translate }}
    </button>

  </div>
</div>
